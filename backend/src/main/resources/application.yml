server:
  port: 8080

spring:
  application:
    name: employee-management-system

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sunny01}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  upload-dir: uploads
  jwt:
    secret: ThisIsADevelopmentOnlySecretKeyThatIsAtLeastThirtyTwoBytes
    expiration-ms: 86400000
    issuer: employee-management-system
